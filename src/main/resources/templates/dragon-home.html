<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DragonGram</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #0f0f0f, #1c1c1c);
      color: #f5f5f5;
    }

    header {
      background-color: #111;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #cc0000;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      color: #ff4500;
      letter-spacing: 1px;
    }

    .logo img {
      height: 40px;
      margin-right: 10px;
    }

    nav a {
      color: #f5f5f5;
      text-decoration: none;
      margin-left: 25px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff4500;
    }

    .feed {
      max-width: 600px;
      margin: 50px auto;
      background: #1a1a1a;
      padding: 20px;
      border: 2px solid #ff4500;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255, 69, 0, 0.2);
    }

    .post {
      border-bottom: 1px solid #333;
      padding: 20px 0;
    }

    .post:last-child {
      border-bottom: none;
    }

    .post h3 {
      margin: 0;
      color: #ff6347;
    }

    .post p {
      margin: 5px 0 0;
      color: #ccc;
    }

    .dragon-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkm8vaayZbXx7YB2NmSgXRmK3XrS283uHakg&s') no-repeat center center;
      background-size: cover;
      opacity: 0.05;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="dragon-bg"></div>

  <header>
    <div class="logo">
      <img src="src/main/resources/templates/ChatGPT Image Aug 3, 2025, 12_35_57 AM.png" alt="Dragon Logo" />
      DragonGram
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Explore</a>
      <a href="#">Logout</a>
    </nav>
  </header>

  <div class="feed">
    <div class="post">
      <h3>@dragon_warrior</h3>
      <p>Just conquered the skies again. 🔥🐉</p>
    </div>
    <div class="post">
      <h3>@firefang</h3>
      <p>Blazing through the week like... 🔥🔥🔥</p>
    </div>
    <div class="post">
      <h3>@scalequeen</h3>
      <p>Moonlight flight was magical 🌕✨</p>
    </div>
  </div>

</body>
</html>
