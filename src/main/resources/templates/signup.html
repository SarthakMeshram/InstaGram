<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram Signup</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram Logo" class="logo" />
      <p class="signup-text">Sign up to see photos and videos from your friends.</p>
      <form id="signupForm">
        <input type="text" id="email" placeholder="Mobile Number or Email" required />
        <input type="text" id="fullname" placeholder="Full Name" required />
        <input type="text" id="newUsername" placeholder="Username" required />
        <input type="password" id="newPassword" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
      <p class="terms">By signing up, you agree to our <a href="#">Terms</a>, <a href="#">Data Policy</a> and <a href="#">Cookies Policy</a>.</p>
    </div>
    <div class="signup-box">
      <p>Have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
  <script src="/js/signup.js"></script>
</body>
</html>
